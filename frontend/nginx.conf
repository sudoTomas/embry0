# LAN vhost: the default_server, answering every Host that no other vhost
# names (published on PROD_PORT, 8200 by default).
#
# The public dashboard vhost is not in this file. The image renders it from
# nginx/dashboard-public.conf.template when DASHBOARD_PUBLIC_HOSTNAME is set
# (nginx/render-dashboard-public.sh); with it unset this is the only
# vhost.
#
# nginx gotcha: add_header directives are inherited from the server block
# only by location blocks that declare NO add_header of their own. /assets/
# and / declare Cache-Control, so they re-state the security headers; keep it
# that way in any new location that adds a header.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Hosted MCP endpoint — streamable HTTP to the mcp service. Bearer-auth
    # enforced by the service itself (401 without a key).
    location /mcp {
        # Resolve at request time via Docker DNS so nginx boots (and the rest
        # of the dashboard serves) even when the mcp service is not running.
        resolver 127.0.0.11 valid=10s;
        set $mcp_upstream http://mcp:9200;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # API proxy — all /api/* requests go to orchestrator
    location /api/ {
        proxy_pass http://orchestrator:8000;
        # HTTP/1.1 is required for SSE — under HTTP/1.0 nginx buffers the full
        # response regardless of `proxy_buffering off`, because chunked transfer
        # encoding only exists in HTTP/1.1. Without this line `/api/v1/.../logs/
        # {service}?follow=true` would not stream events to the client.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        # SSE support (e.g. /api/v1/jobs/{id}/artifacts/logs/{service}?follow=true):
        # disable response buffering and caching so events flush to the client
        # per-line, and allow chunked transfer for the open-ended stream.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Knowledge maps (docs/maps.md): a scanner PUTs a gzipped map of several
    # MB, past nginx's 1 MB default body limit. Only this vhost and these
    # paths take the larger body; the orchestrator caps the decompressed size
    # itself. The public vhost keeps the default, so upload over the LAN.
    # No trailing slash: a prefix ending in "/" makes nginx answer the bare
    # /api/v1/maps (the list) with a 301 to /api/v1/maps/.
    location ^~ /api/v1/maps {
        client_max_body_size 32m;
        proxy_pass http://orchestrator:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket proxy — /ws/* with protocol upgrade
    location /ws/ {
        proxy_pass http://orchestrator:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Webhook proxy — GitHub POSTs to /webhook
    location /webhook {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check proxy — /health and /health/ready
    location /health {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
    }

    # Hashed build output is immutable — a changed file always has a new name.
    # This block declares no add_header of its own beyond the cache one, so
    # re-state the security headers (see the inheritance note at the top).
    location /assets/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html for client-side routing.
    # index.html must be revalidated every time: it is the only file naming the
    # current hashed bundles, so a cached copy pins a browser to the previous
    # build after a deploy. Without an explicit Cache-Control, browsers apply
    # heuristic freshness from Last-Modified and do exactly that.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
