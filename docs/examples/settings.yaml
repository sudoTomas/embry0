# The embry0 settings document: every section, every key at its default.
#
# Generated from the sections in embry0/settings/sections/ by
#   python -m embry0.settings.example --write docs/examples/settings.yaml
# and printed by `embry0 settings export --default`.
#
# Every key below is a comment, so applying this file as it is sets nothing.
# Uncomment the keys you change and leave the rest out: a key you do not
# write takes its default, including a default a later release changes.
# Check a file with `embry0 settings check FILE`, see what it would change
# with `embry0 settings diff FILE`, and store it with `embry0 settings apply
# FILE`. Each key is described in docs/configuration.md#settings-reference.
version: 1

# Uncomment to keep this document in a file, written with `embry0 settings
# apply`: the dashboard then shows it read-only. Leave it out to edit the
# document on the dashboard too.
# managed_by: file

# When and how often embry0 asks a person about a decision that waits on them.
asks:
  # Keep one ask per person a decision waits on, for a chat assistant to send
  # from GET /asks/due. While false the ask loop does nothing and the feed is
  # empty; asks already stored wait.
  # enabled: false

  # Working hours in `timezone`, HH-HH from 00 to 24, start first. An ask is
  # due, and a reminder goes, only within them.
  # hours: 09-18

  # The days asks go out: a day name (mon to sun), a range such as mon-fri or
  # sun-thu, or a list such as mon,wed,fri.
  # weekdays: mon-fri

  # The IANA time zone `hours` and `weekdays` are read in, such as
  # Europe/Berlin.
  # timezone: UTC

  # Hours an ask waits unanswered before its one reminder.
  # remind_hours: 24.0

  # Days after it was sent that an unanswered ask expires. That answers
  # nothing, and the person is not asked about that decision again. One handed
  # out but never reported sent expires this many days after it was handed
  # out, and its person may be asked again this many days later. An ask still
  # queued does not expire.
  # expire_days: 7.0

  # Unanswered asks one person holds at once about one organization's
  # decisions; the next, worst first, is released as one is answered or
  # expires. A decision handed to someone goes to them at once, past this
  # limit.
  # max_open_per_person: 3

  # Also ask about what a chat is otherwise spared: a low-readiness ticket, a
  # weed, a crack below break. They wait behind everything else their person
  # is asked.
  # include_held: false

  # The name of a group to ask about a decision nobody owns; the chat
  # assistant knows how to reach it. Anyone embry0 knows may answer those.
  # Empty: they are asked of nobody and stay on the decisions page.
  # unowned_group: ''

  # Minutes an ask handed out by `GET /asks/due` stays with the poll that took
  # it: it counts toward its person's limit and goes to no other poll until it
  # is reported sent or this lapses. Then it is handed out again, before any
  # other ask of its person. A second report of a send within this many
  # minutes of the first, with no reminder handed out between, is a second
  # poll's copy, not the reminder.
  # lease_minutes: 15.0

  # How often the ask loop runs: it expires asks past `expire_days`, withdraws
  # those whose decision was answered or moved on, and queues one for each
  # person a decision now waits on.
  # tick_seconds: 120.0

# Which repositories the leads finders, the scout and the Slop-O-Meter read.
background:
  # The leads finders read this repository, when the leads loop runs and
  # someone answers for the repository (owners set, or a watched stack). False
  # takes a repository, or every repository of an organization, out; the leads
  # already stored stay until answered.
  # leads: true

  # The scout starts read-only scouting jobs on this repository and its areas,
  # on the model background_models.scout names. Off until an operator enrolls
  # a repository, an organization or the deployment. Upgrading keeps what it
  # read before, and SCOUT_REPOS and SCOUT_EXCLUDE, in each repository's
  # layer, once.
  # scout: false

  # The Slop-O-Meter keeps a bare mirror of this repository and reads its
  # history and forge events to score it. Off until enrolled; upgrading keeps
  # what it read before, and SLOP_METER_REPOS and SLOP_METER_EXCLUDE, in each
  # repository's layer, once. An inactive repository is not read but keeps
  # what was read. One that leaves (false, or unregistered) has its mirror,
  # its rows and its contributors' names and emails removed prune_after_days
  # later, unless it comes back first.
  # slop_meter: false

  # Days the Slop-O-Meter waits after a repository leaves its scope before it
  # removes the mirror and the rows it kept of it; one that comes back within
  # them keeps everything. The deployment's alone.
  # prune_after_days: 7

# The models embry0's background features run on: a default, and each
# feature's own.
background_models:
  # The model of your own server, custom/<model>, the features below run on
  # unless they name their own; null for none. It must call tools and answer
  # over chat completions, since any of them may run on it. The scout never
  # does unless it is named for it.
  # default: null

  # The model of your own server the watcher's log analyses prefer: they run
  # on it while a local slot is free, else on their agents' own models. null:
  # the default; false: no preference.
  # watcher: null

  # The model of your own server scheduled context audits prefer, as the
  # watcher's analyses do. A model chosen with Run with wins. null: the
  # default; false: no preference.
  # context_audit: null

  # The model every scouting job is pinned to, a run waiting for it; a hosted
  # one's jobs are metered and capped like any job. false, the default: no
  # model, and the scout starts nothing; null: the default model.
  # scout: false

  # The model that writes each owner proposal's plain-words brief, asked over
  # chat completions; a hosted one's calls count against the budget caps.
  # null: the default; false: none is written, and the feed shows each
  # proposal's summary.
  # proposal_brief: null

  # The model that writes each job's brief, asked over chat completions; a
  # hosted one's calls count against the budget caps. null: the default;
  # false: none is written.
  # job_brief: null

  # The model the Slop-O-Meter asks whether an outlier commit is slop, over
  # chat completions; a hosted one's calls count against the budget caps.
  # null: the default; false: outliers stay unjudged and the score
  # provisional.
  # slop_judge: null

# What embry0 may spend: each job's ceiling, the daily and monthly caps, the
# unattended jobs' caps, and how far a person may continue a job past its cap.
budget:
  # The most one job may spend, in US dollars: the ceiling of the cap triage
  # or a job's own max_budget_usd picks, and of every unattended job's cap
  # below, checked after every agent turn. 0 sets no ceiling. A person's
  # continue past the cap goes on top of it unless continue_may_exceed_ceiling
  # is false.
  # max_budget_per_job_usd: 10.0

  # No job is dispatched once today's spend reaches this, in US dollars. 0
  # sets no daily cap.
  # daily_cap_usd: 100.0

  # No job is dispatched once this month's spend reaches this, in US dollars.
  # 0 sets no monthly cap.
  # monthly_cap_usd: 500.0

  # Jobs one person may dispatch in any hour. 0 sets no limit. embry0's own
  # watcher and the continuations of a job a person already started are
  # exempt; the spend caps still apply to them.
  # rate_limit_per_author_per_hour: 5

  # What a job does on crossing its cap: soft lets the step finish, then
  # pauses for a person to continue, merge or stop it; hard fails it with
  # ERR_BUDGET_OVERRUN. A job may pin itself to hard, and the unattended jobs
  # always do.
  # overrun_mode: soft

  # The hard cap of one job the context audit schedule starts, or a person
  # starts with POST /orgs/{owner}/context-audit/run, in US dollars.
  # context_audit_job_usd: 2.0

  # Most context-audit jobs one round of the schedule (every
  # context_audit.check_minutes) starts for an organization; the due
  # repositories past it wait for the next round. 0 starts none.
  # context_audit_max_jobs_per_tick: 3

  # The hard cap of one job that maps a repository's areas (POST
  # /repos/{repo}/-/areas/map), in US dollars.
  # area_map_job_usd: 2.0

  # The hard cap of the job that fixes one context-audit finding an owner
  # accepted from the proposals, in US dollars.
  # fix_job_usd: 2.0

  # The most a person may name as extra_budget_usd when they continue a job
  # past its cap (POST /jobs/{id}/resume), in US dollars.
  # continue_extra_max_usd: 1000.0

  # Whether a person's continue may take a job past max_budget_per_job_usd.
  # false makes the ceiling a hard limit: a continue adds only what is left
  # under it, and a job already at it cannot be continued.
  # continue_may_exceed_ceiling: true

  # How much more a continue lets a job spend when the person names no amount,
  # in US dollars; null is one more cap. At most continue_extra_max_usd.
  # continue_default_extra_usd: null

# Which files the context audit reads in a repository, how often its schedule
# looks, and how many repositories it reads at once.
context_audit:
  # Days between a repository's scheduled audits: the schedule audits it when
  # its instruction files change, and again this many days after its newest
  # audit once its default branch moved. 1 to 365; false or null is off, the
  # default, so nothing is audited until the deployment, an organization or a
  # repository sets it. Written with PATCH, null takes the key out of a layer,
  # which then reads the layer below, and false turns the schedule off in it.
  # Was the organization's context_audit_days.
  # days: null

  # An audit that finds outdated claims commits the fixes it checked on a
  # branch of its own and opens a pull request for a person to review and
  # merge (ADR 0022), one open at a time per repository; false leaves the
  # findings in the job's report. Was the organization's
  # context_audit_open_prs.
  # open_prs: false

  # The instruction files the context audit reads in a repository, as globs
  # over its tracked files: `**/` matches any number of directories, none
  # included, and `*` any characters within one path segment. A glob holds
  # only letters, digits, `.`, `_`, `-`, `+`, `@`, `*` and `/`, starts at the
  # repository's root and never ends with `**`. A glob with no wildcard that
  # names a directory, such as `.kiro/steering`, selects every tracked file
  # under it, whatever its kind, as git does: write `.kiro/steering/*.md` for
  # its Markdown alone. null reads the built-in list (docs/context-audit.md);
  # a list replaces it whole, so name every file to read. A change that
  # selects other files makes each repository it touches due once.
  # files: null

  # Directories never searched for instruction files, each one name matched at
  # any depth: vendored and generated trees, whose instruction files belong to
  # another project. null reads the built-in list (`.git`, `.venv`, `build`,
  # `dist`, `node_modules`, `vendor`, `venv`); a list replaces it whole, and
  # [] searches every directory.
  # exclude_dirs: null

  # Minutes between two looks of the schedule at the repositories of every
  # organization it audits: one commit read per repository, and its tree when
  # the head moved. A change applies within 15 minutes. The deployment's
  # alone: it paces the forge calls of every organization's audits together.
  # check_minutes: 15

  # Repositories of one organization read from the forge at once, by the
  # schedule, by GET /orgs/{owner}/context-audit and by a run by hand. The
  # deployment's alone.
  # read_concurrency: 8

  # The share of a credential's forge rate limit (X-RateLimit-Limit), in
  # percent, below which the schedule defers for the organizations reading
  # with it: no paid read and no audit started until the window ends, so the
  # last calls stay with the jobs that use the same credential. The window is
  # the reset the forge names, at most an hour; with none it can use, 15
  # minutes, then one call asks again. A head read with an ETag still goes
  # out, since a branch that did not move answers 304 for free. A run by hand
  # and GET /orgs/{owner}/context-audit read no further either, and a run by
  # hand starts nothing. A forge that sends no limit is never deferred, and 0
  # never defers. The deployment's alone.
  # rate_reserve_percent: 20

# Where a ticket states a code job's finish line, and how often a coding run
# goes back to unmet items.
done_when:
  # How many times a coding run that reports a done-when item unmet, or none,
  # goes again on the unmet items before the job pauses at stage
  # done_when_unmet. 0 pauses at the first such report. Each retry is another
  # coding run, inside the job's budget.
  # retries: 1

  # The ticket headings under which a ticket states its finish line, at least
  # one and each named once. Triage keeps the bullets there as a code job's
  # done-when items, they are the list when triage drafts none, and review
  # reads them when a job has no list. The first section, in this order, that
  # lists bullets is read; when none does, review reads the first with any
  # text. A heading matches a ticket heading that starts with its words, at a
  # word boundary and in any case, with trailing # marks ignored: Acceptance
  # criteria matches Acceptance criteria (must), and A does not match
  # Approach. Write them without the leading # marks. A heading that an
  # earlier one already matches can never be read, so list the longer one
  # first.
  # ticket_sections:
  # - Acceptance criteria

# Whether the finders run, which ones and how often, and which leads are
# offered and asked in chat.
leads:
  # Run the finders on their schedule, on the repositories someone answers for
  # (owners set, or a watched stack), and offer what they find as owner
  # proposals. While false the loop does nothing; POST /leads/run still runs a
  # pass by hand, and the leads already stored stay until answered.
  # enabled: false

  # The finders that run, each named once: ticket (backlog tickets nobody
  # labelled for embry0), ci (checks failing on the default branch), alert
  # (dependency and code-scanning alerts), flaky (a check that failed and then
  # passed on one commit), review (review threads nobody answered). An empty
  # list runs none.
  # finders:
  # - ticket
  # - ci
  # - alert
  # - flaky
  # - review

  # Hours between passes of the finders; the backlog intake keeps its own
  # interval.
  # interval_hours: 6.0

  # Hours between backlog intakes (ticket), which read Linear once for every
  # repository.
  # backlog_interval_hours: 24.0

  # Most new leads each finder adds per repository in a day, the most severe
  # first; a lead already stored is always kept up to date. 0 adds none.
  # max_new_per_repo_per_day: 5

  # Days a review thread waits for an answer before it is a lead.
  # review_stale_days: 3

  # Newest commits of the default branch the flaky-check finder reads.
  # flaky_commits: 10

  # The lowest readiness (0 to 100) a backlog ticket must score to be stored
  # as a lead at all; one below it is never offered.
  # offer_min: 40

  # The lowest readiness (0 to 100) at which an offered backlog ticket is
  # asked in chat. One below it is held: left out of the chat feed and never
  # sent as an ask, shown on the page only, folded, its brief written after
  # the others, and its readiness marked on its decision card.
  # ask_min: 60

  # Which leads are asked in chat, by kind: a kind named here is asked only at
  # the severities it lists, and one of another severity is held like a ticket
  # below `ask_min`. An empty list asks none of that kind; a kind not named is
  # asked at every severity. Only a kind whose proposals carry a severity may
  # be named: case (low, medium, high, critical, warning, unrated); ticket,
  # ci, alert, flaky, review, crack, weed (low, medium, high, critical).
  # Written entry by entry, not whole: the deployment's document overrides
  # only the kinds it names and keeps the default for every other kind, and an
  # organization's layer overrides only the kinds it names over the
  # deployment's. To ask every severity of a kind, list them all.
  # ask_severities:
  #   crack:
  #   - high
  #   - critical
  #   weed:
  #   - high
  #   - critical

# The subject of the commit that keeps the work of a coding run that stopped
# before it committed.
salvage:
  # The subject of the commit that keeps a stopped coding run's work. {agent}
  # is the coding agent that stopped (developer or slopmaster) and {reason}
  # why (turn cap, an error with its code, budget reached, question rounds
  # used up); write {{ and }} for a literal brace. One line, not starting with
  # #. A subject longer than 100 characters has only its {reason} shortened to
  # fit, ending in …. Set it to what the repository's commit rules accept,
  # such as `chore(wip): unfinished — {agent} stopped ({reason})`.
  # commit_subject: 'wip: unfinished — {agent} stopped ({reason})'

# What the scout runs, how often it comes back to a repository, and how much
# it may start and spend.
scout:
  # The templates the scout runs on each repository and area, at least one and
  # each named once: garden (one provable weed) and kintsugi-trace (a ledger
  # of graded cracks).
  # templates:
  # - garden
  # - kintsugi-trace

  # Most scouting jobs out at once; 0 starts none, and the jobs already out
  # are still read into leads. Keep it below the local model server's slots so
  # the watcher and briefs still get one.
  # max_in_flight: 2

  # Hours before a repository or area is scouted again with the same template.
  # revisit_hours: 24.0

  # Most leads one scouting job adds, the worst first.
  # max_leads_per_job: 5

  # The hard cap of one scouting job, in US dollars. A job pinned to the local
  # model bills nothing; this stops one whose pin is ever lost.
  # job_budget_usd: 1.0

  # Most scouting jobs started in any 24 hours; null sets no cap, and 0 starts
  # none.
  # max_jobs_per_day: null

# How the Slop-O-Meter weighs a changed line and a person's attention, where
# its levels fall, which identities are bots, and how often and how hard it
# reads the forge.
slop_meter:
  # The meter reads the repositories enrolled in background.slop_meter and
  # scores them. false stops the reading and the scoring everywhere; what was
  # kept of a repository that left the scope is still removed after
  # background.prune_after_days. Was SLOP_METER_INTERVAL_SECONDS=0. The
  # deployment's alone.
  # enabled: true

  # Hours between two runs over every enrolled repository: fetch, read the
  # next part of its history and events, and rescore it once caught up. While
  # a history is still being read the meter comes back sooner
  # (SLOP_METER_CATCHUP_SECONDS). A change applies within five minutes. At
  # least a quarter hour. Was SLOP_METER_INTERVAL_SECONDS. The deployment's
  # alone.
  # interval_hours: 24.0

  # Forge API calls one run may make with one credential, shared round-robin
  # by the repositories read with it, to read comments, reviews and logins:
  # the deployment's value is the credential's budget. An organization's value
  # only narrows its own repositories' share of it, never widens it, and never
  # lowers another organization's on the same credential. A repository its
  # share stops before its events are all read keeps its previous score, or
  # stays unscored, until a run reads them all: a run reads from the first
  # listing again. Git fetches are not API calls.
  # api_calls_per_tick: 200

  # The rate limit a credential keeps for the jobs that use it: once its
  # remaining calls (X-RateLimit-Remaining) drop below this, the run makes no
  # further call with it. An organization's larger value stops only its own
  # repositories' reads sooner; a smaller one changes nothing.
  # rate_reserve: 2000

  # What one changed line of a file weighs, by glob, from 0 to 10; a file no
  # glob matches weighs 0, so data, documents and binaries never count. A glob
  # with no '/' matches a file's name in any directory (*.py), one with a '/'
  # its path from the repository's root (db/migrations/*.sql, generated/**);
  # '*' matches within one name, '?' one character, '**' any directories.
  # Where several match, the most specific wins: a glob with a '/' over any
  # without one; between two with one, more segments free of wildcards, then
  # fewer ** segments, then fewer other segments with a wildcard, then more
  # segments, then more literal characters; between two without, more literal
  # characters (*.min.js over *.js); then the first in alphabetical order. So
  # generated/** weighs every file under generated/, whatever its kind, and
  # src/main.py wins over src/**/main.py. At most 16 globs that name no
  # literal directory, no extension and no three literal characters in a row
  # (*/*, *x*). Write globs in lowercase, quoted: matching ignores case, and
  # YAML reads a bare * as an alias. Merged entry by entry: a document adds or
  # changes the globs it names and keeps every other, so a glob set to 0 stops
  # counting; at most 1000 globs in all, counted with the defaults and what a
  # write inherits.
  # weights:
  #   '*.py': 1.0
  #   '*.pyi': 1.0
  #   '*.ts': 1.0
  #   '*.mts': 1.0
  #   '*.cts': 1.0
  #   '*.js': 1.0
  #   '*.mjs': 1.0
  #   '*.cjs': 1.0
  #   '*.go': 1.0
  #   '*.rs': 1.0
  #   '*.java': 1.0
  #   '*.kt': 1.0
  #   '*.kts': 1.0
  #   '*.scala': 1.0
  #   '*.c': 1.0
  #   '*.h': 1.0
  #   '*.cc': 1.0
  #   '*.cpp': 1.0
  #   '*.cxx': 1.0
  #   '*.hpp': 1.0
  #   '*.hh': 1.0
  #   '*.cs': 1.0
  #   '*.rb': 1.0
  #   '*.php': 1.0
  #   '*.swift': 1.0
  #   '*.m': 1.0
  #   '*.mm': 1.0
  #   '*.ex': 1.0
  #   '*.exs': 1.0
  #   '*.erl': 1.0
  #   '*.clj': 1.0
  #   '*.cljs': 1.0
  #   '*.hs': 1.0
  #   '*.ml': 1.0
  #   '*.fs': 1.0
  #   '*.lua': 1.0
  #   '*.pl': 1.0
  #   '*.pm': 1.0
  #   '*.r': 1.0
  #   '*.jl': 1.0
  #   '*.dart': 1.0
  #   '*.zig': 1.0
  #   '*.nim': 1.0
  #   '*.groovy': 1.0
  #   '*.sh': 1.0
  #   '*.bash': 1.0
  #   '*.zsh': 1.0
  #   '*.ps1': 1.0
  #   '*.tf': 1.0
  #   '*.sol': 1.0
  #   '*.proto': 1.0
  #   '*.graphql': 1.0
  #   '*.gql': 1.0
  #   '*.sql': 0.8
  #   '*.tsx': 0.5
  #   '*.jsx': 0.5
  #   '*.vue': 0.5
  #   '*.svelte': 0.5
  #   '*.astro': 0.5
  #   '*.html': 0.5
  #   '*.htm': 0.5
  #   '*.erb': 0.5
  #   '*.hbs': 0.5
  #   '*.ejs': 0.5
  #   '*.jinja': 0.5
  #   '*.j2': 0.5
  #   '*.twig': 0.5
  #   '*.liquid': 0.5
  #   '*.css': 0.3
  #   '*.scss': 0.3
  #   '*.sass': 0.3
  #   '*.less': 0.3
  #   '*.styl': 0.3
  #   '*.pcss': 0.3
  #   '*.min.js': 0.0
  #   '*.min.css': 0.0
  #   '*.bundle.js': 0.0
  #   '*.map': 0.0
  #   '*.d.ts': 0.0

  # Directories whose files weigh nothing, each one name matched at any depth:
  # vendored and third-party code. A list replaces the one it inherits whole;
  # [] excludes none.
  # excluded_dirs:
  # - vendor
  # - node_modules
  # - third_party
  # - third-party
  # - external
  # - deps
  # - bower_components

  # Directories whose files are tests or examples, each one name matched at
  # any depth: their lines weigh test_weight of what weights says. A list
  # replaces the one it inherits whole.
  # test_dirs:
  # - __tests__
  # - tests
  # - test
  # - spec
  # - specs
  # - examples
  # - example
  # - demos
  # - demo
  # - samples
  # - sample
  # - fixtures
  # - testdata

  # Globs of test and example files, in the grammar of weights (*_test.go,
  # test_?*.py): their lines weigh test_weight of what weights says. A list
  # replaces the one it inherits whole.
  # test_files:
  # - '*_test.go'
  # - '*_test.py'
  # - '*_test.rb'
  # - '*_test.ex'
  # - '*_test.exs'
  # - '*_spec.rb'
  # - test_?*.py

  # Words that mark a test or example file when they come just before its
  # extension: test marks a.test.ts and b.test.py, but not a.test.helper.ts.
  # Their lines weigh test_weight of what weights says. A list replaces the
  # one it inherits whole.
  # test_marks:
  # - test
  # - spec
  # - stories
  # - story

  # A test or example file's lines weigh this share of what their file's glob
  # in weights says.
  # test_weight: 0.5

  # Size dampening: while a codebase holds fewer weighted lines than this, a
  # week's lines cost in proportion to its size, so a young project's first
  # lines cost little; from this size on, in full.
  # bootstrap_lines: 5000

  # Size dampening: how much more a line costs as the codebase grows, per
  # doubling past 100,000 weighted lines (the cost is min(1, size /
  # bootstrap_lines) + complexity_weight × log2(1 + size / 100,000)).
  # complexity_weight: 0.05

  # Hours of a person's attention each commit they author implies, before its
  # time.
  # commit_hours: 1.0

  # Hours more for each commit a squash merge folded in (a body that lists two
  # or more bullet lines).
  # subcommit_hours: 1.0

  # Each human Co-authored-by trailer implies this share of commit_hours, in
  # trailer order; the last share applies to every co-author after it. Each
  # from 0 to 1.
  # coauthor_shares:
  # - 0.5
  # - 0.25
  # - 0.125

  # A commit with an AI co-author implies this share of the hours its author's
  # commit would.
  # ai_coauthor_share: 0.8

  # Hours of attention each comment, review comment and review on the forge
  # implies (GitHub only).
  # event_hours: 1.0

  # Weighted lines one hour of a person's attention covers.
  # lines_per_hour: 40.0

  # The most hours one person's week counts, on a concave curve (h −
  # h³/(3·cap²)), so overtime counts for less and nothing past the cap.
  # weekly_hours_cap: 80.0

  # Authors with fewer human commits than this are drive-bys: their time
  # counts for nothing. Their share rises to full at core_full_commits, and up
  # to a quarter more for a large share of the history.
  # core_min_commits: 10

  # The human commits at which an author's time counts in full. More than
  # core_min_commits.
  # core_full_commits: 60

  # When no author has reached core_min_commits, everyone's time counts in
  # full: a small repository has no core team to call anyone a drive-by, and
  # read literally every author of it counts for nothing and all its code
  # reads as slop. embry0's departure from the published algorithm; false
  # scores such a repository as the algorithm is written.
  # small_repository_in_full: true

  # Net weighted lines a commit must add to be an outlier, judged by a model
  # on background_models.slop_judge: slop, or a code drop, an import or a move
  # that is not.
  # outlier_min_lines: 2000

  # Outlier commits judged per year of the project's age, the largest first;
  # at least one however young.
  # outliers_per_year: 4

  # What the model judging an outlier commit is told slop is and is not. The
  # answer's form (JSON with slop and a reason) is added after it. Applies to
  # commits judged after it changes: a judgment is kept and never asked again,
  # so a change rescores nothing.
  # judge_prompt: |-
  #   You judge one large commit of a software repository: did it add bulk code no
  #   person wrote or reviewed line by line (slop, such as a large AI-generated
  #   change), or is its size explained by something else (not slop: the project's
  #   initial import, a code drop moved in from elsewhere, a restructuring that moved
  #   files, a vendored or generated library, a data or fixture dump)?
  #   Judge from what the message and the files say. When it is unclear, answer
  #   slop: false only if the files themselves look moved, vendored or generated.

  # Where the five levels part: a score below the first bound is level 1,
  # below the second level 2, and so on; at or above the last, level 5. Four
  # bounds, each above the one before, from 0 to 1.
  # level_bounds:
  # - 0.2
  # - 0.4
  # - 0.6
  # - 0.8

  # The five levels' names, level 1 (the least slop) first. Each one line,
  # each named once.
  # level_names:
  # - Buttered Noodles
  # - Spaghetti Bolognese
  # - Lasagna
  # - Sloppy Joe
  # - Just The Slop

  # Bots, as commit names, addresses or forge logins matched whole without
  # regard to case: their commits add lines but no attention, and as a
  # co-author they count as an AI agent does. Beyond the ones every deployment
  # knows ([bot] accounts, noreply@ addresses, known coding agents) and
  # embry0's own commit identities. Each document adds to the list it
  # inherits, so a bot the deployment lists counts for every organization; no
  # layer takes one out, and a bot spelled otherwise is the same one. At most
  # 200 in all, counted with what a write inherits. Was the organization's
  # slop_meter_bots.
  # bots: []

  # AI coding agents beyond the known ones, each its commit address up to and
  # including the @ (aider@, any domain) or a whole address
  # (agent@tools.example), matched without regard to case: a commit one
  # authors adds lines but no attention, and one it co-authors counts
  # ai_coauthor_share of its author's hours. Each document adds to the list it
  # inherits, as bots. At most 200 in all, counted with what a write inherits.
  # ai_agents: []

# What embry0 does with a code job or a finding judged slop: whether and where
# it is routed, what the classifiers and the reviewer are told, its kinds, its
# ticket heading and the meter levels it acts on.
slop_policy:
  # A code job judged slop runs route_template instead of the route triage
  # picked. False: it takes its normal route, the verdict is still recorded on
  # the job, and triage is told so.
  # enabled: true

  # The pipeline template a code job judged slop runs. A write that changes
  # it, by naming another or by taking the key out, must leave a template that
  # takes a code job: one whose jobs are recorded as code jobs and whose route
  # has a coding step. A template a document routes to cannot be deleted,
  # renamed or changed to stop taking one. A job pinned to the full pipeline
  # takes it only when its route also has review and QA. A template a person
  # named for the job still wins.
  # route_template: slop-cleanup

  # The least slop_score (0 to 100, how much of the trouble is shape) a slop
  # verdict needs to be routed. 0 routes every slop verdict; one below it
  # takes its normal route.
  # min_score_to_route: 0

  # The kinds of slop a verdict may name, as lowercase words joined by _. A
  # kind a classifier names that is not here is dropped from its verdict.
  # Describe each in classifier_guide, which is what the classifiers are told.
  # kinds:
  # - duplication
  # - dead_code
  # - half_wired
  # - contradicting_layers
  # - symptom_patch
  # - misleading_docs
  # - off_pattern

  # What triage and the watcher are told slop, a bug and noise are, and what
  # slop_score means, in their system prompts. Name each of kinds in it.
  # classifier_guide: |-
  #   Tell slop apart from bugs:
  #   - bug: the behavior differs from what the code, its docs or the ticket intend.
  #     Fixing it changes behavior.
  #   - slop: the behavior is what the code says, and the trouble is the code's
  #     shape. Cleaning it keeps behavior. Kinds: duplication (the same logic in
  #     more than one place), dead_code (paths, flags or files nothing reaches),
  #     half_wired (a feature or abstraction started and not finished),
  #     contradicting_layers (two layers that disagree about one thing),
  #     symptom_patch (guards, retries, fallbacks or catch-alls stacked on a symptom
  #     instead of its cause), misleading_docs (comments or docs that say what the
  #     code does not do), off_pattern (code that ignores the repository's own way).
  #   - noise: nothing to do.
  #   A guard, retry or catch-all stacked on a symptom is slop when removing it and
  #   fixing the shape keeps the outcome. When the code does the wrong thing (keeps
  #   retrying what can never succeed, drops or duplicates data, answers wrongly),
  #   it is a bug, even when sloppy code caused it: say bug, and name the slop in
  #   the evidence. Do not call a real defect slop to make it look smaller.
  #   slop_score (0-100) is how much of the trouble is shape rather than behavior:
  #   0 for a pure bug, 100 for pure slop.

  # What the reviewer of a change the Slopmaster made is told to check, before
  # its usual instructions. The lines the branch adds and removes are said
  # after it.
  # review_guide: |-
  #   ## This change is a slop cleanup
  #
  #   It was judged slop, not a bug: it must keep behavior and improve shape.
  #   Approve only when all of these hold, and request changes otherwise, saying which:
  #   - behavior is unchanged: the tests pass, and no public behavior, API or output
  #     moved (removing what nothing reaches is fine);
  #   - the change removes or merges more than it adds, or is plainly simpler;
  #   - it adds no new guard, retry, fallback, catch-all or flag to hide a symptom.

  # The heading, without its # marks, that the watcher's draft ticket for a
  # finding judged slop opens with, in the tracker it files to. Triage is told
  # to weigh a section under it.
  # ticket_heading: Slop, not a bug

  # The Slop-O-Meter level (1 to 5) from which triage leans toward slop on a
  # borderline verdict, told with the levels' names (slop_meter.level_names).
  # Null: it is given the reading and never told to lean.
  # triage_lean_min_level: 4

  # The Slop-O-Meter level (1 to 5) from which a repository or an area has a
  # Slop Dungeon on the world map even with no open slop finding. Null: only
  # open slop and recent cleanups make one.
  # dungeon_min_level: 2

# What the dashboard shows: the game layer, and the page it opens on.
ui:
  # Show the game layer: the guild, the agents' levels, skills and outfits,
  # the Achievements page, the chat box and the Game content tab. While false
  # the dashboard opens on the Overview, and GET /world, its characters and
  # quests, GET /progression and POST /progression/rebuild answer 404.
  # Reviewing a job and the content pack's routes work either way.
  # game: true

  # The page the dashboard opens on: guild or overview. While `game` is false
  # it opens on the Overview, whatever this says.
  # home: guild
