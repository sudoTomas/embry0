# The embry0 settings document: every section, every key at its default.
#
# Generated from the sections in embry0/settings/sections/ by
#   python -m embry0.settings.example --write docs/examples/settings.yaml
# and printed by `embry0 settings export --default`.
#
# Every key below is a comment, so applying this file as it is sets nothing.
# Uncomment the keys you change and leave the rest out: a key you do not
# write takes its default, including a default a later release changes.
# Check a file with `embry0 settings check FILE`, see what it would change
# with `embry0 settings diff FILE`, and store it with `embry0 settings apply
# FILE`. Each key is described in docs/configuration.md#settings-reference.
version: 1

# Uncomment to keep this document in a file, written with `embry0 settings
# apply`: the dashboard then shows it read-only. Leave it out to edit the
# document on the dashboard too.
# managed_by: file

# When and how often embry0 asks a person about a decision that waits on them.
asks:
  # Keep one ask per person a decision waits on, for a chat assistant to send
  # from GET /asks/due. While false the ask loop does nothing and the feed is
  # empty; asks already stored wait.
  # enabled: false

  # Working hours in `timezone`, HH-HH from 00 to 24, start first. An ask is
  # due, and a reminder goes, only within them.
  # hours: 09-18

  # The days asks go out: a day name (mon to sun), a range such as mon-fri or
  # sun-thu, or a list such as mon,wed,fri.
  # weekdays: mon-fri

  # The IANA time zone `hours` and `weekdays` are read in, such as
  # Europe/Berlin.
  # timezone: UTC

  # Hours an ask waits unanswered before its one reminder.
  # remind_hours: 24.0

  # Days after which an unanswered ask expires. That answers nothing, and the
  # person is not asked about that decision again.
  # expire_days: 7.0

  # Unanswered asks one person holds at once about one organization's
  # decisions; the next, worst first, is released as one is answered or
  # expires.
  # max_open_per_person: 3

  # How often the ask loop runs: it expires asks past `expire_days`, withdraws
  # those whose decision was answered or moved on, and queues one for each
  # person a decision now waits on.
  # tick_seconds: 120.0

# What embry0 may spend: each job's ceiling, the daily and monthly caps, the
# unattended jobs' caps, and how far a person may continue a job past its cap.
budget:
  # The most one job may spend, in US dollars: the ceiling of the cap triage
  # or a job's own max_budget_usd picks, and of every unattended job's cap
  # below, checked after every agent turn. 0 sets no ceiling. A person's
  # continue past the cap goes on top of it unless continue_may_exceed_ceiling
  # is false.
  # max_budget_per_job_usd: 10.0

  # No job is dispatched once today's spend reaches this, in US dollars. 0
  # sets no daily cap.
  # daily_cap_usd: 100.0

  # No job is dispatched once this month's spend reaches this, in US dollars.
  # 0 sets no monthly cap.
  # monthly_cap_usd: 500.0

  # Jobs one person may dispatch in any hour. 0 sets no limit. embry0's own
  # watcher and the continuations of a job a person already started are
  # exempt; the spend caps still apply to them.
  # rate_limit_per_author_per_hour: 5

  # What a job does on crossing its cap: soft lets the step finish, then
  # pauses for a person to continue, merge or stop it; hard fails it with
  # ERR_BUDGET_OVERRUN. A job may pin itself to hard, and the unattended jobs
  # always do.
  # overrun_mode: soft

  # The hard cap of one job the context audit schedule starts, or a person
  # starts with POST /orgs/{owner}/context-audit/run, in US dollars.
  # context_audit_job_usd: 2.0

  # Most context-audit jobs one round of the schedule (every 15 minutes)
  # starts for an organization; the due repositories past it wait for the next
  # round. 0 starts none.
  # context_audit_max_jobs_per_tick: 3

  # The hard cap of one job that maps a repository's areas (POST
  # /repos/{repo}/-/areas/map), in US dollars.
  # area_map_job_usd: 2.0

  # The hard cap of the job that fixes one context-audit finding an owner
  # accepted from the proposals, in US dollars.
  # fix_job_usd: 2.0

  # The most a person may name as extra_budget_usd when they continue a job
  # past its cap (POST /jobs/{id}/resume), in US dollars.
  # continue_extra_max_usd: 1000.0

  # Whether a person's continue may take a job past max_budget_per_job_usd.
  # false makes the ceiling a hard limit: a continue adds only what is left
  # under it, and a job already at it cannot be continued.
  # continue_may_exceed_ceiling: true

  # How much more a continue lets a job spend when the person names no amount,
  # in US dollars; null is one more cap. At most continue_extra_max_usd.
  # continue_default_extra_usd: null

# Where a ticket states a code job's finish line, and how often a coding run
# goes back to unmet items.
done_when:
  # How many times a coding run that reports a done-when item unmet, or none,
  # goes again on the unmet items before the job pauses at stage
  # done_when_unmet. 0 pauses at the first such report. Each retry is another
  # coding run, inside the job's budget.
  # retries: 1

  # The ticket headings under which a ticket states its finish line, at least
  # one and each named once. Triage keeps the bullets there as a code job's
  # done-when items, they are the list when triage drafts none, and review
  # reads them when a job has no list. The first section, in this order, that
  # lists bullets is read; when none does, review reads the first with any
  # text. A heading matches a ticket heading that starts with its words, at a
  # word boundary and in any case, with trailing # marks ignored: Acceptance
  # criteria matches Acceptance criteria (must), and A does not match
  # Approach. Write them without the leading # marks. A heading that an
  # earlier one already matches can never be read, so list the longer one
  # first.
  # ticket_sections:
  # - Acceptance criteria

# The subject of the commit that keeps the work of a coding run that stopped
# before it committed.
salvage:
  # The subject of the commit that keeps a stopped coding run's work. {agent}
  # is the coding agent that stopped (developer or slopmaster) and {reason}
  # why (turn cap, an error with its code, budget reached, question rounds
  # used up); write {{ and }} for a literal brace. One line, not starting with
  # #. A subject longer than 100 characters has only its {reason} shortened to
  # fit, ending in …. Set it to what the repository's commit rules accept,
  # such as `chore(wip): unfinished — {agent} stopped ({reason})`.
  # commit_subject: 'wip: unfinished — {agent} stopped ({reason})'

# What the scout runs, how often it comes back to a repository, and how much
# it may start and spend.
scout:
  # The templates the scout runs on each repository and area, at least one and
  # each named once: garden (one provable weed) and kintsugi-trace (a ledger
  # of graded cracks).
  # templates:
  # - garden
  # - kintsugi-trace

  # Most scouting jobs out at once; 0 starts none, and the jobs already out
  # are still read into leads. Keep it below the local model server's slots so
  # the watcher and briefs still get one.
  # max_in_flight: 2

  # Hours before a repository or area is scouted again with the same template.
  # revisit_hours: 24.0

  # Most leads one scouting job adds, the worst first.
  # max_leads_per_job: 5

  # The hard cap of one scouting job, in US dollars. A job pinned to the local
  # model bills nothing; this stops one whose pin is ever lost.
  # job_budget_usd: 1.0

  # Most scouting jobs started in any 24 hours; null sets no cap, and 0 starts
  # none.
  # max_jobs_per_day: null

# What the dashboard shows: the game layer, and the page it opens on.
ui:
  # Show the game layer: the guild, the agents' levels, skills and outfits,
  # the Achievements page, the chat box and the Game content tab. While false
  # the dashboard opens on the Overview, and GET /world, its characters and
  # quests, GET /progression and POST /progression/rebuild answer 404.
  # Reviewing a job and the content pack's routes work either way.
  # game: true

  # The page the dashboard opens on: guild or overview. While `game` is false
  # it opens on the Overview, whatever this says.
  # home: guild
