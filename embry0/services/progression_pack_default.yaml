    category: guarding
    what_counts: "QA runs that completed"
    flavour: "Every dose checked before it was drunk."
    icon: potion
    metric: qa_passed
    thresholds: [1, 5, 15, 30, 60, 120, 250]
  - id: you_shall_not_merge
