    metric: areas_mapped
    thresholds: [1, 2, 3, 5, 8, 13, 21]
  - id: fashion_inspector
    name: Fashion Inspector
    category: lore
    what_counts: "Repositories whose design audit scored 90 or more against their standard"
    flavour: "Matching outfit, full set bonus."
    icon: gem
    metric: design_score
    params: {min_score: 90}
    thresholds: [1, 2, 3, 5, 8, 13, 21]
  # ---- Guarding ----
  - id: guardian_of_the_gate
    name: Guardian of the Gate
    category: guarding
    what_counts: "Reviews a reviewer agent finished"
    flavour: "None shall pass unread."
    icon: shield
    metric: reviews
    params: {agents: [review, pr-reviewer]}
    thresholds: [1, 10, 25, 50, 100, 250, 500]
  - id: second_opinion
