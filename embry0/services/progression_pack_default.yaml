    params: {min_resumes: 1}
    thresholds: [1, 3, 5, 10, 25, 50, 100]
  - id: lag_survivor
    name: Lag Survivor
    category: grit
    what_counts: "A job interrupted twice or more that still finished its work"
    flavour: "The server restarted. Twice. You lived."
    icon: hourglass
    secret: true
    metric: resumed
    params: {min_resumes: 2}
    thresholds: [1]
  - id: second_wind
    name: Second Wind
    category: grit
    what_counts: "Follow-up jobs on a pull request whose pull request then merged"
