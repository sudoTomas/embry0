    icon: hourglass
    secret: true
    metric: merged_running_over
    params: {hours: 2}
    thresholds: [1]
  - id: lucky_find
    name: Lucky Find
    category: oddities
    what_counts: "A pull request that merged from the first job embry0 ever ran on its repository"
    flavour: "Beginner's luck."
    icon: paw
    secret: true
    metric: lucky_find
    thresholds: [1]
  - id: ninety_nine_problems
    name: 99 Problems
    category: oddities
    what_counts: "A production error seen 99 times or more that a merged fix killed"
    flavour: "But a bug ain't one."
    icon: skull
    secret: true
    metric: fixed_recurring
    params: {min_seen: 99}
    thresholds: [1]

# Short goals the account completes once, for points and XP to the characters
# that did the work. A quest's steps are its kind's; its texts may use its
# params as {name} placeholders.
quests:
  - id: first_steps
    kind: onboard_to_merge
    name: First Steps
    points: 1
    reward: "1 quest point; Operations and Coding XP"
    steps: ["Onboard a repository", "Finish its first job", "Merge its first pull request"]
    xp:
      - {agent: onboarding, skill: operations, xp: 40000}
      - {agent: developer, skill: coding, xp: 40000}
  - id: try_again
    kind: merge_after_failure
    name: "Try, Try Again"
    points: 1
    reward: "1 quest point; Recovery XP"
    steps: ["Watch a job on an issue fail", "Merge a later job on that issue"]
    xp:
      - {agent: developer, skill: recovery, xp: 60000}
  - id: gatekeeper
    kind: review_qa_merge
    name: Gatekeeper
    points: 2
    reward: "2 quest points; Reviewing and Quality assurance XP"
    steps: ["Review an issue's pull request", "Pass QA on it", "Merge it"]
    params: {review_agents: [review, pr-reviewer], qa_agents: [qa]}
    xp:
      - {agent: review, skill: reviewing, xp: 50000}
      - {agent: qa, skill: quality_assurance, xp: 50000}
  - id: divine_warden
    kind: capstone
    name: Divine Warden
    points: 5
    reward: "5 quest points; a Divine trim on every cape"
    steps: ["Merge {merges} pull requests", "Complete a repo diary at Elite"]
    requirement: "A character at total level {total_level:,}"
    params: {merges: 100, diary_tier: elite, total_level: 1000}
    cloak_trim: true

# One diary per repository, in tiers; a tier is done when its last task is.
diaries:
  tiers:
    - id: easy
      name: Easy
      tasks:
        - {kind: triage, params: {agents: [triage]}, text: "Triage an issue"}
        - {kind: finish_job, text: "Finish a job"}
        - {kind: run_qa, params: {agents: [qa]}, text: "Run QA"}
    - id: medium
      name: Medium
      tasks:
        - {kind: merges, params: {count: 1}, text: "Merge a pull request"}
        - {kind: pass_qa, params: {agents: [qa]}, text: "Pass QA"}
        - {kind: audit, text: "Audit its context"}
    - id: hard
      name: Hard
      tasks:
        - {kind: merges, params: {count: 10}, text: "Merge {count} pull requests"}
        - {kind: clean_audit, text: "Audit its context and find no outdated claim"}
        - {kind: reviews, params: {count: 10, agents: [review, pr-reviewer]}, text: "Review {count} times"}
    - id: elite
      name: Elite
      tasks:
        - {kind: merges, params: {count: 50}, text: "Merge {count} pull requests"}
        - {kind: quiet_stretch, params: {days: 30}, text: "Go {days} days without a failed job"}
        - {kind: all_above, text: "Complete every task above"}

# The chat box, bottom left: one message per thing that happened.
messages:
  level: "{character} reached {skill} level {level}."
  agent_level: "{character} is now level {level}."
  rare: "{character} found a {rare}."
  quest: "Quest done: {name}."
  diary: "The {tier} tasks of the {repo} diary are done."
  achievement_tier: "{name} reached {tier}."
  achievement_complete: "Achievement done: {name}."

# The game's nouns the pages print.
labels:
  complete: Complete
  quest_journal: Deeds
  journal_points: deed points
  quest_point: point
  quest_points: points
  gear: "{tier} gear"
  mastery_cloak: "{skill} cape"
  trimmed_cloak: "{skill} cape (trimmed)"
  quest_cloak: quest cloak
