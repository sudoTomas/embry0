[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embry0"
version = "0.1.0"
description = "General-purpose agent orchestration engine built on LangGraph and Claude Agent SDK"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tomas McMonigal" }]
requires-python = ">=3.12"
# No "License ::" classifier: `license` above is an SPDX expression (PEP 639),
# which replaces it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "structlog>=26.1,<27",
    "asyncpg>=0.32,<0.33",
    "fastapi>=0.136.3,!=0.137.0,!=0.137.1,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "httpx>=0.27,<1",
    "langgraph>=1.2.14,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<3.3",
    "aiohttp>=3.14.4,<4",
    "claude-agent-sdk>=0.2.164,<0.3",
    "psycopg[binary]>=3.0,<4",
    "cryptography>=50.0.2,<51",
    "prometheus-fastapi-instrumentator>=8.1,<9",
    "minio>=7.2,<8",
    "pyyaml>=6.0,<7",
    "sse-starlette>=3.5,<4",
    "mcp>=2.3,<3",
    "joserfc>=1.7,<2",
    "itsdangerous>=2.1,<3",
]

[project.urls]
Repository = "https://github.com/sudoTomas/embry0"
Issues = "https://github.com/sudoTomas/embry0/issues"
Changelog = "https://github.com/sudoTomas/embry0/blob/main/CHANGELOG.md"

[project.scripts]
embry0 = "embry0.cli.__main__:main"
embry0-mcp = "embry0.mcp_server.server:main"
embry0-mcp-http = "embry0.mcp_server.http:main"

[project.entry-points."embry0.workspace_providers"]
npm-workspaces-turbo = "embry0.workspace_providers.npm_workspaces_turbo.provider:NpmWorkspacesTurboProvider"
static-apps = "embry0.workspace_providers.static_apps:StaticAppsProvider"

[project.entry-points."embry0.workspace_init"]
git = "embry0.workspace_init.git:GitWorkspaceInitializer"
http = "embry0.workspace_init.http:HttpWorkspaceInitializer"
local = "embry0.workspace_init.local:LocalWorkspaceInitializer"
none = "embry0.workspace_init.none:NoneWorkspaceInitializer"

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<9.3",
    "pytest-asyncio>=1.4,<1.5",
    "pytest-cov>=7.0,<8",
    "pytest-timeout>=2.3,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16,<0.18",
    "mypy>=2.4,<2.5",
    "pytest-aiohttp>=1.0,<2",
    "types-PyYAML>=6,<7",
]

[dependency-groups]
# What infra/Dockerfile.proxy installs: three of the dependencies above, so
# `uv export --only-group proxy` gives the image their locked versions and
# hashes, with everything they need. Not a default group: `uv sync` and the
# orchestrator image leave it out (its packages are dependencies anyway).
proxy = ["aiohttp", "httpx", "structlog"]

[tool.hatch.build.targets.wheel]
packages = ["embry0"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
# ruff 0.16 also formats Python code blocks in Markdown, by default. Our .md
# files are docs and agent prompts: their code blocks are excerpts a reformat
# can corrupt (a list excerpt became tuples), and in a prompt any rewrite
# changes the instructions an agent is given.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # Line length enforced by formatter, not linter

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "sandbox_smoke: real-sandbox end-to-end tests. Run with `pytest -m sandbox_smoke`.",
    "requires_docker: integration tests that need a real Docker daemon. Run with `pytest -m requires_docker`.",
    "requires_postgres: requires a live PostgreSQL instance at TEST_DATABASE_URL.",
    "changes_schema: tests the migrations or changes the schema; its database is migrated from empty, and the next test's too. Every test of a test_migration* module has it.",
    "requires_minio: needs a reachable MinIO instance (set MINIO_ENDPOINT)",
    "requires_dind: needs a reachable DinD instance (set DIND_ENDPOINT)",
]
