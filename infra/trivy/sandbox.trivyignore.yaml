  # The vibium binary (QA image): Go standard library 1.26.1. vibium 26.8.21
  # is the newest release and the floor the QA browser-backend contract is
  # validated against (Dockerfile.sandbox.qa); no release built with a fixed Go
  # exists yet. It drives the image's own Chrome, in a sandbox with no internet
  # egress at job time. Removed by bumping vibium to a release built with
  # Go >= 1.26.10. npm installs one of two binaries by architecture; both are
  # built with Go 1.26.1 and carry the same 24 findings, so each entry names
  # both (the docker, compose and Python paths do not depend on it).
