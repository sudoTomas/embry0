# Findings accepted in the orchestrator image's libraries (#305).
#
# CI's "Trivy — orchestrator libraries" step fails on a fixable HIGH or
# CRITICAL in a library of the orchestrator image: the Python packages from
# uv.lock and anything else Trivy reads as a language package. Fix one with
# a lock bump. When that cannot happen yet, accept it here, one entry per
# finding:
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       paths:
#         - usr/local/lib/python3.12/site-packages/example-1.0.0.dist-info/METADATA
#       statement: why it is accepted and what removes it
#       expired_at: 2026-12-31
#
# `statement` and `expired_at` are required
# (tests/unit/infra/test_orchestrator_image_scan.py). Trivy stops honouring an
# entry on its `expired_at` date, so the step fails again then and the
# acceptance is decided anew. `paths` narrows an entry to one package; leave
# it out only for a finding that has no single path.
vulnerabilities:
  # The compose plugin (#342) is pinned to the release the QA image uses,
  # v5.6.1, which links golang.org/x/net 0.58.0; its Go is fixed (1.26.10).
  # v5.7.0 links 0.60.0, which fixes CVE-2026-78669, but reworks how `up`
  # starts containers, so both images move to it together, deliberately
  # (infra/trivy/sandbox.trivyignore.yaml accepts the same findings in the QA
  # image). CVE-2026-78661 (x/net/html) is fixed in x/net 0.62.0, which no
  # compose release links yet: v5.7.0 and compose's main branch link 0.60.0;
  # compose builds no x/net/html code into the binary. Removed by a compose
  # release that links x/net >= 0.62.0. The orchestrator only lists a QA
  # workspace's services and follows its logs with it, over DinD's socket.
  - id: CVE-2026-78669
    paths:
      - usr/libexec/docker/cli-plugins/docker-compose
    statement: compose v5.6.1, the QA image's release, links golang.org/x/net 0.58.0; v5.7.0 has the fix, and both images move to it together
    expired_at: 2026-12-15
  - id: CVE-2026-78661
    paths:
      - usr/libexec/docker/cli-plugins/docker-compose
    statement: compose v5.6.1, the QA image's release, links golang.org/x/net 0.58.0; the fix is in x/net 0.62.0, which no compose release links yet (v5.7.0 links 0.60.0); removed by a compose release that links >= 0.62.0
    expired_at: 2026-12-15
